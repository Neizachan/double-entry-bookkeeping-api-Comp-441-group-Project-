name: COMP441 CI Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-coverage:
    name: Build, test and coverage gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and enforce coverage
        run: mvn --batch-mode verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comp441-test-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  mutation-gate:
    name: Mutation score gate (PIT)
    runs-on: ubuntu-latest
    needs: build-test-coverage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run PIT and fail below 95% mutation score
        run: >
          mvn --batch-mode test-compile
          org.pitest:pitest-maven:mutationCoverage
          -DmutationThreshold=95
          -Dpit.reportsDir=target/pit-reports/ci

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comp441-pit-report
          path: target/pit-reports/ci/
          if-no-files-found: warn
          retention-days: 14
